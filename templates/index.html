<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IntelliChat</title><link rel="stylesheet" href="/static/style.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script></head><body>

<!-- ===== LOGIN ===== -->
<div id="auth" class="authpage" hidden><div class="authbox">
  <div class="logo-circle">✦</div><h1 id="authTitle">Welcome back</h1>
  <form id="authForm"><input id="username" autocomplete="username" placeholder="Username" required minlength="3"><input id="password" type="password" autocomplete="current-password" placeholder="Password (10+ characters)" required><button class="cont" type="submit" id="authSubmit">Continue</button></form>
  <p class="switch"><span id="switchText">Don’t have an account?</span> <a href="#" id="switchMode">Sign up</a></p>
  <div class="or"><span>OR</span></div><div id="googleButton" class="googlebutton"></div><p id="googleHint" class="hint"></p><p id="authError" class="error" role="alert"></p>
</div></div>

<!-- ===== APP ===== -->
<div class="app" id="app" hidden>
  <aside id="sidebar"><div class="side-top"><button class="iconbtn logo" id="homeBtn" aria-label="Home">✦</button><button class="iconbtn" id="collapse" aria-label="Close sidebar"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="3.5" width="15" height="13" rx="3"/><path d="M8 3.5v13"/></svg></button></div>
    <button class="navitem" id="new"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 17l1-4 9.5-9.5a1.8 1.8 0 012.5 2.5L6.5 15.5 3 17z"/></svg>New chat</button>
    <label class="navitem search"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5L17 17"/></svg><input id="search" placeholder="Search chats" autocomplete="off"></label>
    <div class="side-label">Chats</div><nav id="chats" aria-label="Chats"></nav>
    <div class="sidebar-bottom"><div class="profile"><div class="avatar" id="avatar">U</div><div class="pname"><strong id="identity"></strong><small>Free</small></div><button class="iconbtn" id="theme" aria-label="Toggle theme" title="Toggle theme">◐</button></div><button class="navitem" id="logout">Log out</button></div></aside>
  <div class="scrimm" id="scrimm"></div>
  <main>
    <header><button class="iconbtn" id="open" aria-label="Open sidebar"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="3.5" width="15" height="13" rx="3"/><path d="M8 3.5v13"/></svg></button>
      <div class="modelwrap"><button id="modelBtn" class="modelbtn" aria-haspopup="listbox" aria-expanded="false"><span id="modelName">Model</span><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l5 5 5-5"/></svg></button><div id="modelMenu" class="menu" role="listbox" hidden></div></div></header>
    <section id="messages" aria-live="polite"><div class="welcome"><h1>What can I help with?</h1></div></section>
    <section id="workflow"></section>
    <div class="composer-wrap"><div id="improve" class="improve" hidden></div><form id="form"><textarea id="prompt" rows="1" maxlength="12000" placeholder="Ask anything" required></textarea>
      <div class="compose-bottom"><div class="left"><label class="pill" title="Search the web for sources"><input id="research" type="checkbox" checked><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7.5"/><path d="M2.5 10h15M10 2.5c2.5 2.2 2.5 12.8 0 15M10 2.5c-2.5 2.2-2.5 12.8 0 15"/></svg>Search</label>
      <button type="button" class="pill improve-btn" id="improveBtn" disabled title="Rewrite your prompt for better results"><svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5l1.7 4.8 4.8 1.7-4.8 1.7L10 14.5 8.3 9.7 3.5 8l4.8-1.7L10 1.5zM15.5 12l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/></svg>Improve prompt</button>
      </div><button class="send" type="submit" aria-label="Send"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 16V4M4.5 9.5L10 4l5.5 5.5"/></svg></button></div></form>
      <footer>IntelliChat can make mistakes. Check important info.</footer></div></main></div>
<script src="/static/app.js"></script></body></html>
